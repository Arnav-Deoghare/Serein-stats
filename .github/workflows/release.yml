name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant gradlew permission
        run: chmod +x gradlew

      # Decode the keystore from a repo secret into a file that only exists on
      # this ephemeral runner. The .jks itself is never committed to the repo.
      - name: Decode signing keystore
        run: echo "${{ secrets.SEREIN_KEYSTORE_BASE64 }}" | base64 --decode > ${{ runner.temp }}/release.jks

      - name: Build release APK
        env:
          SEREIN_STORE_FILE: ${{ runner.temp }}/release.jks
          SEREIN_STORE_PASSWORD: ${{ secrets.SEREIN_STORE_PASSWORD }}
          SEREIN_KEY_ALIAS: ${{ secrets.SEREIN_KEY_ALIAS }}
          SEREIN_KEY_PASSWORD: ${{ secrets.SEREIN_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Serein ${{ github.ref_name }}"
          files: app/build/outputs/apk/release/app-release.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}